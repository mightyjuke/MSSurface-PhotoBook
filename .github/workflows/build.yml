name: build

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - name: Build Surface RT binary
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: "7"
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.buildVersion=${GITHUB_SHA}" -o dist/photobook-armv7 .
          (cd dist && sha256sum photobook-armv7 > photobook-armv7.sha256)
          printf '%s\n' "$GITHUB_SHA" > dist/photobook-version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: photobook-linux-armv7
          path: |
            dist/photobook-armv7
            dist/photobook-armv7.sha256
            dist/photobook-version.txt
      - name: Publish edge update
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view edge >/dev/null 2>&1 || \
            gh release create edge --prerelease --target "$GITHUB_SHA" \
              --title "PhotoBook edge" \
              --notes "Automatically updated from the main branch."
          gh release upload edge \
            dist/photobook-armv7 \
            dist/photobook-armv7.sha256 \
            dist/photobook-version.txt \
            --clobber
