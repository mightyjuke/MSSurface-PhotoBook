name: build

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - name: Build Surface RT binary
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: "7"
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o dist/photobook-armv7 .
      - uses: actions/upload-artifact@v4
        with:
          name: photobook-linux-armv7
          path: dist/photobook-armv7
